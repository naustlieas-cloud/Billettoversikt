<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Billettoversikt</title>
  <style>
    :root {
      color-scheme: light;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      background: #f5f6f8;
      color: #1e1f24;
      height: 100vh;
    }

    header {
      padding: 16px 20px 0;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      grid-template-rows: repeat(2, minmax(0, 1fr));
      gap: 12px;
      padding: 0 20px 20px;
      height: calc(100vh - 64px);
    }

    .panel {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(30, 31, 36, 0.08);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid #e3e5eb;
    }

    .panel h2 {
      margin: 0;
      padding: 10px 14px;
      font-size: 16px;
      background: #f0f2f6;
      border-bottom: 1px solid #e3e5eb;
    }

    .panel iframe {
      border: 0;
      width: 100%;
      height: 100%;
      flex: 1;
      overflow: hidden;
    }

    @media (max-width: 900px) {
      .grid {
        grid-template-columns: 1fr;
        grid-template-rows: repeat(4, minmax(0, 1fr));
        height: auto;
      }

      body {
        height: auto;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Oversikt per dag</h1>
  </header>
  <main class="grid">
    <section class="panel">
      <h2>Torsdag</h2>
      <iframe
        title="Torsdag"
        src="https://ticketco.events/no/nb/security_reports/bdf144d0984d80c717b5"
        scrolling="no"
      ></iframe>
    </section>
    <section class="panel">
      <h2>Fredag</h2>
      <iframe
        title="Fredag"
        src="https://ticketco.events/no/nb/security_reports/05ec8073488b3155488e"
        scrolling="no"
      ></iframe>
    </section>
    <section class="panel">
      <h2>Lørdag</h2>
      <iframe
        title="Lørdag"
        src="https://ticketco.events/no/nb/security_reports/cdf70284a860698055da"
        scrolling="no"
      ></iframe>
    </section>
    <section class="panel">
      <h2>Søndag</h2>
      <iframe
        title="Søndag"
        src="https://ticketco.events/no/nb/security_reports/7fa8b3c3e089b374cb51"
        scrolling="no"
      ></iframe>
    </section>
  </main>
</body>
</html>
